version: '3.9'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-bienesraices
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql

  node-app:
    build: .
    container_name: bienesraices-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - mysql
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  tailwind:
    image: node:18
    container_name: tailwind-build
    working_dir: /usr/src/app
    command: npm run css
    volumes:
      - .:/usr/src/app
    depends_on:
      - node-app

volumes:
  mysql_data: